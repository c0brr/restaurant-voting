spring:
  application:
    name: restaurant-voting
  jpa:
    # https://stackoverflow.com/a/67678945/548473
    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 200
        jdbc.batch_size: 20
  datasource:
    url: jdbc:h2:mem:voting
    #        tcp: jdbc:h2:tcp://localhost:9092/mem:voting
    username: sa
    password:
  jackson:
    visibility.field: any
    visibility.getter: none
    visibility.setter: none
    visibility.is-getter: none

logging:
  file:
    name: logs/app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: WARN
    ru.erulaev.restaurantvoting: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      file-name-pattern: logs/app-%d{yyyy-MM-dd}.%i.log
      max-history: 50


server.servlet:
  encoding:
    charset: UTF-8 # Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly
    enabled: true # Enable http encoding support
    force: true

springdoc.swagger-ui.path: /

app:
  voting-deadline: "11:00"